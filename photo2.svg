<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bobaSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bobaSky)" />

  <!-- Boba Cup -->
  <g transform="translate(180, 100)">
    <!-- Big Straw -->
    <rect x="110" y="20" width="22" height="180" rx="10" transform="rotate(12 120 100)" fill="#fb7185" />
    <rect x="115" y="20" width="8" height="180" rx="4" transform="rotate(12 120 100)" fill="#fff" opacity="0.6"/>

    <!-- Cup Lid -->
    <ellipse cx="120" cy="140" rx="80" ry="20" fill="#fff" />
    <ellipse cx="120" cy="138" rx="82" ry="16" fill="#f43f5e" opacity="0.8" />

    <!-- Cup Body -->
    <path d="M 45 145 L 65 370 Q 120 395 175 370 L 195 145 Z" fill="url(#teaGrad)" opacity="0.9" />
    <path d="M 50 145 L 65 370 Q 120 395 175 370 L 195 145 Z" fill="#ffffff" opacity="0.15" />

    <!-- Boba Pearls -->
    <circle cx="85" cy="340" r="14" fill="#38040e" />
    <circle cx="82" cy="337" r="4" fill="#ffffff" opacity="0.7" />
    
    <circle cx="120" cy="355" r="15" fill="#38040e" />
    <circle cx="117" cy="352" r="4" fill="#ffffff" opacity="0.7" />

    <circle cx="155" cy="340" r="14" fill="#38040e" />
    <circle cx="152" cy="337" r="4" fill="#ffffff" opacity="0.7" />

    <circle cx="100" cy="315" r="13" fill="#38040e" />
    <circle cx="138" cy="320" r="14" fill="#38040e" />
    <circle cx="75" cy="305" r="12" fill="#38040e" />
    <circle cx="165" cy="300" r="13" fill="#38040e" />

    <!-- Kawaii Face on Boba -->
    <circle cx="95" cy="230" r="6" fill="#4c0519" />
    <circle cx="145" cy="230" r="6" fill="#4c0519" />
    <ellipse cx="80" cy="240" rx="9" ry="5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="160" cy="240" rx="9" ry="5" fill="#f43f5e" opacity="0.6"/>
    <path d="M 112 240 Q 120 248 128 240" stroke="#4c0519" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sparkles -->
  <polygon points="100,100 108,120 128,128 108,136 100,156 92,136 72,128 92,120" fill="#fbbf24"/>
  <polygon points="500,220 505,235 520,240 505,245 500,260 495,245 480,240 495,235" fill="#fbbf24"/>

  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#590d22" text-anchor="middle">
    🧋 Sugar Rush &amp; Gossip Time
  </text>
  <text x="300" y="555" font-family="'Caveat', cursive, sans-serif" font-weight="600" font-size="24" fill="#800f2f" text-anchor="middle">
    "Certified 100% sweetness level."
  </text>
</svg>
