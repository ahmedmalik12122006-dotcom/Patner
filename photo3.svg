<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="catSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#catSky)" />

  <!-- Cute Cat in a Box / Blanket -->
  <g transform="translate(160, 160)">
    <!-- Cat Ears -->
    <polygon points="80,100 110,40 140,90" fill="#fff" stroke="#fda4af" stroke-width="6"/>
    <polygon points="90,95 110,55 130,88" fill="#fb7185"/>
    <polygon points="180,90 210,40 240,100" fill="#fff" stroke="#fda4af" stroke-width="6"/>
    <polygon points="190,88 210,55 230,95" fill="#fb7185"/>

    <!-- Cat Head -->
    <ellipse cx="160" cy="140" rx="85" ry="70" fill="#ffffff" />
    
    <!-- Cat Eyes Closed Happy -->
    <path d="M 105 135 Q 125 150 135 135" stroke="#4c0519" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 185 135 Q 195 150 215 135" stroke="#4c0519" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Nose & Mouth -->
    <polygon points="156,150 164,150 160,156" fill="#f43f5e" />
    <path d="M 160 156 Q 152 166 142 160" stroke="#4c0519" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 160 156 Q 168 166 178 160" stroke="#4c0519" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Cheeks -->
    <circle cx="105" cy="155" r="10" fill="#fda4af" opacity="0.8"/>
    <circle cx="215" cy="155" r="10" fill="#fda4af" opacity="0.8"/>

    <!-- Whiskers -->
    <line x1="80" y1="145" x2="40" y2="140" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="155" x2="40" y2="160" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="145" x2="280" y2="140" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="155" x2="280" y2="160" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>

    <!-- Paws peeking over edge -->
    <ellipse cx="110" cy="215" rx="20" ry="14" fill="#ffffff" stroke="#fecdd3" stroke-width="3"/>
    <ellipse cx="210" cy="215" rx="20" ry="14" fill="#ffffff" stroke="#fecdd3" stroke-width="3"/>
    
    <!-- Cute Strawberry or Flower Hat -->
    <g transform="translate(160, 60)">
      <circle cx="0" cy="0" r="18" fill="#ff4d6d" />
      <polygon points="-8,-12 0,-24 8,-12" fill="#22c55e" />
      <circle cx="-5" cy="-2" r="2" fill="#fff" />
      <circle cx="4" cy="5" r="2" fill="#fff" />
      <circle cx="-2" cy="8" r="2" fill="#fff" />
    </g>
  </g>

  <!-- Cute Hearts Floating -->
  <path d="M 130 110 C 130 95 100 90 100 115 C 100 135 130 155 130 155 C 130 155 160 135 160 115 C 160 90 130 95 130 110 Z" fill="#fb7185" />
  <path d="M 470 180 C 470 165 440 160 440 185 C 440 205 470 225 470 225 C 470 225 500 205 500 185 C 500 160 470 165 470 180 Z" fill="#fb7185" transform="scale(0.7) translate(150, 50)" />

  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#590d22" text-anchor="middle">
    🐱 Chaos Incarnate (Cute Version)
  </text>
  <text x="300" y="555" font-family="'Caveat', cursive, sans-serif" font-weight="600" font-size="24" fill="#800f2f" text-anchor="middle">
    "Certified pretty human. Evidence collected 📸"
  </text>
</svg>
