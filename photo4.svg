<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#sunsetGrad)" />

  <!-- Sunset Sun -->
  <circle cx="300" cy="270" r="85" fill="#fef08a" opacity="0.9"/>
  <circle cx="300" cy="270" r="105" fill="#fef08a" opacity="0.3"/>

  <!-- Fluffy Dreamy Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 80 340 A 30 30 0 0 1 130 320 A 45 45 0 0 1 200 310 A 35 35 0 0 1 240 340 Z"/>
    <path d="M 320 350 A 40 40 0 0 1 380 320 A 55 55 0 0 1 470 325 A 38 38 0 0 1 520 350 Z"/>
    <path d="M 180 370 A 50 50 0 0 1 270 340 A 60 60 0 0 1 380 340 A 45 45 0 0 1 440 370 Z" fill="#fff" opacity="0.95"/>
  </g>

  <!-- Cute Flying Origami / Heart Bird -->
  <g transform="translate(180, 150) scale(0.8)">
    <polygon points="40,20 80,40 50,70" fill="#fff" opacity="0.9"/>
    <polygon points="40,20 10,50 50,70" fill="#fbcfe8" opacity="0.9"/>
    <polygon points="50,70 80,40 90,80" fill="#f472b6"/>
  </g>
  <g transform="translate(380, 110) scale(0.6)">
    <polygon points="40,20 80,40 50,70" fill="#fff" opacity="0.9"/>
    <polygon points="40,20 10,50 50,70" fill="#fbcfe8" opacity="0.9"/>
  </g>

  <!-- Stars / Twinkles -->
  <circle cx="120" cy="80" r="4" fill="#fff" />
  <circle cx="230" cy="60" r="3" fill="#fff" />
  <circle cx="480" cy="90" r="5" fill="#fff" />
  <circle cx="510" cy="180" r="3" fill="#fff" />

  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle">
    🌅 Sunset Walks &amp; Deep Thoughts
  </text>
  <text x="300" y="555" font-family="'Caveat', cursive, sans-serif" font-weight="600" font-size="24" fill="#fce7f3" text-anchor="middle">
    "Okayyy, why are you actually photogenic? 😭"
  </text>
</svg>
