<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gameSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#gameSky)" />

  <!-- Retro Game Controller / Console Graphic -->
  <g transform="translate(150, 160)">
    <!-- Controller Body -->
    <rect x="20" y="50" width="260" height="150" rx="75" fill="#ffffff" stroke="#f43f5e" stroke-width="8"/>
    
    <!-- Screen / Accent area -->
    <path d="M 60 70 Q 150 90 240 70 L 240 180 Q 150 160 60 180 Z" fill="#ffe4e6" opacity="0.6"/>

    <!-- D-Pad -->
    <g transform="translate(70, 90)">
      <rect x="20" y="0" width="16" height="50" rx="4" fill="#fb7185" />
      <rect x="3" y="17" width="50" height="16" rx="4" fill="#fb7185" />
      <circle cx="28" cy="25" r="4" fill="#fff" />
    </g>

    <!-- Action Buttons (Heart shaped buttons) -->
    <g transform="translate(195, 95)">
      <circle cx="35" cy="12" r="12" fill="#fb7185" />
      <circle cx="12" cy="35" r="12" fill="#f43f5e" />
      <circle cx="35" cy="58" r="12" fill="#fda4af" />
      <circle cx="58" cy="35" r="12" fill="#e11d48" />
      <text x="35" y="16" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
      <text x="12" y="39" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
      <text x="35" y="62" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">X</text>
      <text x="58" y="39" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Y</text>
    </g>

    <!-- Joystick and Start/Select -->
    <ellipse cx="125" cy="150" rx="14" ry="14" fill="#fda4af" stroke="#fff" stroke-width="3"/>
    <ellipse cx="175" cy="150" rx="14" ry="14" fill="#fda4af" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Sparkles -->
  <polygon points="120,90 128,110 148,118 128,126 120,146 112,126 92,118 112,110" fill="#fde047"/>
  <polygon points="480,120 486,135 501,140 486,145 480,160 474,145 459,140 474,135" fill="#fde047"/>

  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#590d22" text-anchor="middle">
    🎮 3 AM Brain AFK &amp; Gaming
  </text>
  <text x="300" y="555" font-family="'Caveat', cursive, sans-serif" font-weight="600" font-size="24" fill="#800f2f" text-anchor="middle">
    "Certified Chaos Moment unlocked!"
  </text>
</svg>
