<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#nightSky)" />

  <!-- Crescent Moon with sleepy face -->
  <g transform="translate(180, 110)">
    <path d="M 120 40 A 80 80 0 1 0 200 170 A 95 95 0 0 1 120 40 Z" fill="#fef08a" filter="drop-shadow(0 0 15px rgba(254, 240, 138, 0.6))"/>
    <!-- Sleeping Face -->
    <path d="M 115 120 Q 125 130 135 120" stroke="#854d0e" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="115" cy="135" rx="6" ry="3" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- Constellation and Stardust -->
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.8">
    <line x1="80" y1="180" x2="140" y2="240" />
    <line x1="140" y1="240" x2="220" y2="220" />
    <line x1="220" y1="220" x2="290" y2="300" />
    <line x1="290" y1="300" x2="400" y2="260" />
    <line x1="400" y1="260" x2="480" y2="320" />
  </g>

  <!-- Glowing Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="180" r="6" />
    <circle cx="140" cy="240" r="5" />
    <circle cx="220" cy="220" r="7" fill="#fef08a"/>
    <circle cx="290" cy="300" r="6" />
    <circle cx="400" cy="260" r="7" fill="#fbcfe8"/>
    <circle cx="480" cy="320" r="6" />
    
    <!-- Little sparkles -->
    <circle cx="100" cy="360" r="3" opacity="0.7"/>
    <circle cx="450" cy="120" r="4" opacity="0.8"/>
    <circle cx="320" cy="80" r="3" opacity="0.9"/>
    <circle cx="500" cy="200" r="3" opacity="0.7"/>
  </g>

  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle">
    ✨ Stargazing &amp; Late Night Lore
  </text>
  <text x="300" y="555" font-family="'Caveat', cursive, sans-serif" font-weight="600" font-size="24" fill="#fbcfe8" text-anchor="middle">
    "Another picture for the collection. 🎀"
  </text>
</svg>
